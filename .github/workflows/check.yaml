on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: calcit-lang/setup-cr@0.0.9

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt -- --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

      - run: cargo build --release

      - run: rm -rfv dylibs/* && mkdir dylibs/ && ls target/release/ && cp -v target/release/*.* dylibs/

      - name: Validate Calcit snapshot
        run: |
          caps --ci
          cr calcit.cirru --check-only
          cr calcit.cirru --warn-dyn-method --check-only
          node scripts/check-calcit-upgrade-baseline.mjs
          cr calcit.cirru
