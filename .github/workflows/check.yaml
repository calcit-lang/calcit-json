on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: calcit-lang/setup-calcit@v1.3.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt -- --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

      - run: cargo build --release

      - run: mkdir -p dylibs/ && cp -v target/release/libcalcit_json.* dylibs/

      - run: bash scripts/check-c-safe-ffi.sh

      - name: Validate Calcit snapshot
        run: |
          caps --ci
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru --warn-dyn-method --check-only
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.json
          calcit calcit.cirru

      - name: Validate FFI Interface IR lowering
        run: |
          calcit calcit.cirru ffi export --json > /tmp/calcit-json-ffi-interface-ir.json
          jq -e '
            .data.summary == {"definitions":2,"diagnostics":2,"supported":0,"unsupported":2}
            and ([.data.interface.definitions[].lowering.symbol] | sort == ["json_parse_result","json_stringify_result"])
            and all(.data.interface.definitions[];
              .lowering.backend == "native"
              and .lowering.invoke == "sync"
              and .lowering.kind == "dylib-method"
              and .lowering.transport == "edn-buffer-v1")
            and all(.diagnostics[]; .code == "E_FFI_IR_UNSUPPORTED_TYPE")
          ' /tmp/calcit-json-ffi-interface-ir.json
